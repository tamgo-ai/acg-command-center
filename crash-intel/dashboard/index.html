<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACG Crash Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
  #map { width:100%; height:100%; border-radius:12px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  .kpi { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  .btn { padding: 8px 20px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
  .btn-ghost:hover { background: #1e293b; color: white; }
  .btn-sm { padding: 4px 12px; font-size: 11px; }
  .filter-select { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .tag-active { background: #3b82f6; color: white; }
  .tag-inactive { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
  .scrollbar::-webkit-scrollbar { width: 6px; }
  .scrollbar::-webkit-scrollbar-track { background: #0f172a; }
  .scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  .chart-wrap { position:relative; width:100%; height:100%; }
  .chart-wrap canvas { width:100% !important; height:100% !important; }
  #root { width:100vw; height:100vh; display:flex; }
</style>
</head>
<body>
<div id="root">Cargando...</div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const API = '/crash-intel/api';
const COLORS = ['#3b82f6','#8b5cf6','#06b6d4','#f59e0b','#ef4444','#10b981','#ec4899','#6366f1','#14b8a6','#f97316','#e11d48','#84cc16','#f43f5e','#0ea5e9','#a855f7'];

Chart.defaults.color = '#e2e8f0';
Chart.defaults.borderColor = '#334155';

// ── Chart helper ──────────────────────────────────────────────────────
function useChart(canvasRef, config) {
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, config);
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [config]);
}

// ── Hooks ─────────────────────────────────────────────────────────────
function useFilters() {
  const [filters, setFilters] = useState({ year:[], make:[], city:[], collision_type:[] });
  const [options, setOptions] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    fetch(`${API}/filters`)
      .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(d => setOptions(d))
      .catch(e => setError(e.message));
  }, []);

  const toggle = (key, val) => setFilters(prev => ({
    ...prev, [key]: prev[key].includes(val) ? prev[key].filter(v=>v!==val) : [...prev[key], val]
  }));

  const clearAll = () => setFilters({ year:[], make:[], city:[], collision_type:[] });

  const qs = Object.entries(filters).filter(([_,v])=>v.length>0).flatMap(([k,vs])=>vs.map(v=>`${k}=${encodeURIComponent(v)}`)).join('&');

  return { filters, options, error, toggle, clearAll, qs, loading: !options && !error };
}

// ── Components ────────────────────────────────────────────────────────

function KPI({title, value, color='#3b82f6'}) {
  return <div className="kpi">
    <div className="text-xs uppercase tracking-wider text-slate-400 mb-1">{title}</div>
    <div className="text-2xl font-bold" style={{color}}>{value?.toLocaleString()||'-'}</div>
  </div>;
}

function FilterBar({options, filters, toggle, clearAll}) {
  const [open, setOpen] = useState(null);
  if (!options) return <div className="p-3 bg-slate-900 border-b border-slate-800 text-sm text-slate-500">Cargando filtros...</div>;

  const sections = [
    {key:'year', label:'Año', opts:options.years||[]},
    {key:'make', label:'Marca', opts:options.makes?.slice(0,50)||[]},
    {key:'city', label:'Ciudad', opts:options.cities?.slice(0,80)||[]},
    {key:'collision_type', label:'Tipo', opts:options.collision_types||[]},
  ];

  const activeCount = Object.values(filters).flat().length;

  return <div className="p-3 bg-slate-900 border-b border-slate-800">
    <div className="flex items-center gap-2 flex-wrap">
      {sections.map(s => <div key={s.key} style={{position:'relative'}}>
        <button className={`btn btn-sm ${filters[s.key].length>0?'btn-primary':'btn-ghost'}`}
          onClick={() => setOpen(open===s.key?null:s.key)}>
          {s.label} {filters[s.key].length>0 && `(${filters[s.key].length})`}
        </button>
        {open===s.key && <div className="absolute top-full mt-1 left-0 z-50 bg-slate-800 border border-slate-700 rounded-lg p-2 max-h-48 overflow-y-auto shadow-2xl" style={{minWidth:180}}>
          {s.opts.map(o => <label key={o} className="flex items-center gap-2 px-2 py-1 hover:bg-slate-700 rounded cursor-pointer text-sm">
            <input type="checkbox" checked={filters[s.key].includes(o)} onChange={()=>toggle(s.key,o)}/>
            {o}
          </label>)}
        </div>}
      </div>)}
      {activeCount>0 && <button className="btn btn-sm btn-ghost" onClick={clearAll} style={{color:'#ef4444'}}>✕ Limpiar</button>}
    </div>
  </div>;
}

function HeatmapMap({qs}) {
  const mapRef = useRef(null);
  const heatRef = useRef(null);

  useEffect(() => {
    if (!mapRef.current) {
      mapRef.current = L.map('map').setView([36.7783,-119.4179], 6);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:18}).addTo(mapRef.current);
    }
  }, []);

  useEffect(() => {
    if (!mapRef.current) return;
    const map = mapRef.current;
    const bounds = map.getBounds();
    const params = new URLSearchParams(qs);
    params.set('lat_min', bounds.getSouth());
    params.set('lat_max', bounds.getNorth());
    params.set('lon_min', bounds.getWest());
    params.set('lon_max', bounds.getEast());

    fetch(`${API}/heatmap?${params}`)
      .then(r => r.json())
      .then(data => {
        if (heatRef.current) map.removeLayer(heatRef.current);
        if (data.points?.length > 0) {
          heatRef.current = L.heatLayer(data.points.map(p=>[p.lat,p.lon,p.weight]), {
            radius:15, blur:12, maxZoom:12, max:5,
            gradient:{0.3:'#3b82f6',0.5:'#8b5cf6',0.7:'#f59e0b',0.9:'#ef4444'}
          }).addTo(map);
        }
      }).catch(()=>{});
  }, [qs]);

  return <div id="map"></div>;
}

function TrendChart({qs}) {
  const canvasRef = useRef(null);
  const [data, setData] = useState(null);

  useEffect(() => {
    fetch(`${API}/by-month?${qs}`).then(r=>r.json()).then(d=>{
      setData(d.months?.map(m=>({label:m.month.substring(5), crashes:m.crashes, injured:m.injured}))||[]);
    }).catch(()=>{});
  }, [qs]);

  useChart(canvasRef, {
    type:'line', data:{labels:data?.map(d=>d.label)||[], datasets:[
      {label:'Crashes',data:data?.map(d=>d.crashes)||[],borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.1)',fill:true,tension:0.3},
      {label:'Heridos',data:data?.map(d=>d.injured)||[],borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,0.1)',fill:true,tension:0.3},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11}}}}}
  });

  return <div className="card" style={{height:'100%'}}>
    <h3 className="text-sm font-semibold text-slate-300 mb-2">📈 Tendencia mensual</h3>
    <div style={{height:'calc(100% - 30px)'}}><canvas ref={canvasRef}></canvas></div>
  </div>;
}

function TopMakes({qs}) {
  const canvasRef = useRef(null);
  const [data, setData] = useState([]);

  useEffect(() => {
    fetch(`${API}/by-make?limit=15&${qs}`).then(r=>r.json()).then(d=>setData(d.makes?.slice(0,15)||[])).catch(()=>{});
  }, [qs]);

  useChart(canvasRef, {
    type:'bar', data:{labels:data.map(m=>m.make), datasets:[
      {label:'Accidentes',data:data.map(m=>m.crash_count),backgroundColor:COLORS,borderRadius:4}
    ]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });

  return <div className="card" style={{height:'100%'}}>
    <h3 className="text-sm font-semibold text-slate-300 mb-2">🚗 Marcas más accidentadas</h3>
    <div style={{height:'calc(100% - 30px)'}}><canvas ref={canvasRef}></canvas></div>
  </div>;
}

function CollisionDonut({qs}) {
  const canvasRef = useRef(null);
  const [data, setData] = useState([]);

  useEffect(() => {
    fetch(`${API}/by-collision-type?${qs}`).then(r=>r.json()).then(d=>setData(d.types?.slice(0,8)||[])).catch(()=>{});
  }, [qs]);

  useChart(canvasRef, {
    type:'doughnut', data:{labels:data.map(t=>t.collision_type_desc), datasets:[
      {data:data.map(t=>t.total),backgroundColor:COLORS,borderWidth:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},padding:8}}}}
  });

  return <div className="card" style={{height:'100%'}}>
    <h3 className="text-sm font-semibold text-slate-300 mb-2">💥 Tipos de colisión</h3>
    <div style={{height:'calc(100% - 30px)'}}><canvas ref={canvasRef}></canvas></div>
  </div>;
}

function CityBars({qs}) {
  const canvasRef = useRef(null);
  const [data, setData] = useState([]);

  useEffect(() => {
    fetch(`${API}/by-city?limit=12&${qs}`).then(r=>r.json()).then(d=>{
      setData(d.cities?.filter(c=>c.city_name!=='Unincorporated').slice(0,10)||[]);
    }).catch(()=>{});
  }, [qs]);

  useChart(canvasRef, {
    type:'bar', data:{labels:data.map(c=>c.city_name), datasets:[
      {label:'Crashes',data:data.map(c=>c.total_crashes),backgroundColor:'#3b82f6',borderRadius:4}
    ]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });

  return <div className="card" style={{height:'100%'}}>
    <h3 className="text-sm font-semibold text-slate-300 mb-2">🏙️ Top ciudades</h3>
    <div style={{height:'calc(100% - 30px)'}}><canvas ref={canvasRef}></canvas></div>
  </div>;
}

function DayHourCharts({qs}) {
  const dayRef = useRef(null);
  const hourRef = useRef(null);

  useEffect(() => {
    fetch(`${API}/by-day-of-week?${qs}`).then(r=>r.json()).then(d=>{
      const labels = d.days?.map(x=>x.day)||[];
      const values = d.days?.map(x=>x.crashes)||[];
      if(dayRef.current) {
        const ctx = dayRef.current.getContext('2d');
        if(ctx._chart) ctx._chart.destroy();
        ctx._chart = new Chart(ctx, {type:'bar',data:{labels,datasets:[{data:values,backgroundColor:'#8b5cf6',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
      }
    }).catch(()=>{});

    fetch(`${API}/by-hour?${qs}`).then(r=>r.json()).then(d=>{
      const labels = d.hours?.map(x=>x.hour)||[];
      const values = d.hours?.map(x=>x.n)||[];
      if(hourRef.current) {
        const ctx = hourRef.current.getContext('2d');
        if(ctx._chart) ctx._chart.destroy();
        ctx._chart = new Chart(ctx, {type:'bar',data:{labels,datasets:[{data:values,backgroundColor:'#06b6d4',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
      }
    }).catch(()=>{});
  }, [qs]);

  return <>
    <div className="card" style={{height:'100%'}}><h3 className="text-sm font-semibold text-slate-300 mb-2">📅 Por día</h3><div style={{height:'calc(100% - 30px)'}}><canvas ref={dayRef}></canvas></div></div>
    <div className="card" style={{height:'100%'}}><h3 className="text-sm font-semibold text-slate-300 mb-2">🕐 Por hora</h3><div style={{height:'calc(100% - 30px)'}}><canvas ref={hourRef}></canvas></div></div>
  </>;
}

function LuxuryBrands({qs}) {
  const [data, setData] = useState([]);
  useEffect(() => {
    fetch(`${API}/luxury-brands?${qs}`).then(r=>r.json()).then(d=>setData(d.luxury||[])).catch(()=>{});
  }, [qs]);

  const total = data.reduce((s,m)=>s+m.crashes,0);

  return <div className="card" style={{height:'100%',overflowY:'auto'}}>
    <h3 className="text-sm font-semibold text-slate-300 mb-3">💎 Marcas Premium — {total.toLocaleString()} accidentes</h3>
    <div className="grid grid-cols-4 gap-2" style={{gridTemplateColumns:'repeat(auto-fill,minmax(90px,1fr))'}}>
      {data.map((m,i) => <div key={m.make} className="text-center p-2 rounded-lg" style={{background:'rgba(30,41,59,0.5)'}}>
        <div className="text-xs font-semibold text-slate-300">{m.make}</div>
        <div className="text-lg font-bold" style={{color:COLORS[i%COLORS.length]}}>{m.crashes.toLocaleString()}</div>
      </div>)}
    </div>
  </div>;
}

function Demographics({qs}) {
  const canvasRef = useRef(null);
  const [data, setData] = useState({age_groups:[], genders:[]});

  useEffect(() => {
    fetch(`${API}/demographics?${qs}`).then(r=>r.json()).then(setData).catch(()=>{});
  }, [qs]);

  useChart(canvasRef, data.age_groups?.length > 0 ? {
    type:'bar', data:{labels:data.age_groups.map(g=>g.age_group), datasets:[
      {label:'Conductores',data:data.age_groups.map(g=>g.n),backgroundColor:'#3b82f6',borderRadius:4},
      {label:'Culpables',data:data.age_groups.map(g=>g.at_fault),backgroundColor:'#ef4444',borderRadius:4},
    ]},
    options:{responsive:true,maintainAspectRatio:false}
  } : {type:'bar',data:{labels:[],datasets:[]}});

  return <div className="card" style={{height:'100%'}}>
    <h3 className="text-sm font-semibold text-slate-300 mb-2">👤 Demografía</h3>
    <div style={{height:'calc(100% - 30px)'}}><canvas ref={canvasRef}></canvas></div>
  </div>;
}

// ── Main App ──────────────────────────────────────────────────────────

function App() {
  const { filters, options, error, toggle, clearAll, qs, loading } = useFilters();
  const [stats, setStats] = useState(null);
  const [view, setView] = useState('dashboard');

  useEffect(() => {
    fetch(`${API}/stats?${qs}`).then(r=>r.json()).then(setStats).catch(()=>{});
  }, [qs]);

  if (error) return <div className="flex items-center justify-center w-full" style={{background:'#0f172a'}}>
    <div className="text-center"><div className="text-red-400 text-lg mb-2">⚠️ Error al cargar</div>
    <div className="text-slate-400 text-sm">{error}</div>
    <button className="btn btn-primary mt-4" onClick={()=>location.reload()}>Reintentar</button></div>
  </div>;

  if (loading) return <div className="flex items-center justify-center w-full" style={{background:'#0f172a'}}>
    <div className="text-slate-400 text-lg">Cargando Crash Intelligence...</div>
  </div>;

  return <div className="flex w-full h-full" style={{background:'#0f172a'}}>
    {/* Sidebar */}
    <div className="w-56 flex-shrink-0 flex flex-col" style={{background:'#0f172a',borderRight:'1px solid #1e293b'}}>
      <div className="p-4" style={{borderBottom:'1px solid #1e293b'}}>
        <div className="text-sm font-bold text-white">🚗 ACG Crash Intel</div>
        <div className="text-xs text-slate-500">California CCRS 2023-2025</div>
      </div>
      <nav className="flex-1 p-2 space-y-1">
        {[
          {id:'dashboard',label:'📊 Dashboard'},
          {id:'map',label:'🗺️ Mapa completo'},
          {id:'brands',label:'🚙 Análisis Marcas'},
        ].map(item => <button key={item.id} onClick={()=>setView(item.id)}
          className={`w-full text-left px-3 py-2 rounded-lg text-sm transition ${view===item.id?'text-white':'text-slate-400 hover:text-slate-200'}`}
          style={view===item.id?{background:'#3b82f6'}:{}}>{item.label}</button>)}
      </nav>
      <div className="p-3 text-xs text-slate-600" style={{borderTop:'1px solid #1e293b'}}>
        Data: CHP CCRS + NHTSA<br/>ACG Command Center
      </div>
    </div>

    {/* Main */}
    <div className="flex-1 flex flex-col overflow-hidden">
      <FilterBar options={options} filters={filters} toggle={toggle} clearAll={clearAll} />

      <div className="flex-1 overflow-y-auto p-4 space-y-4" style={{display:view==='dashboard'?'block':'none'}}>
        <div className="grid grid-cols-5 gap-3">
          <KPI title="Total Crashes" value={stats?.total_crashes} color="#3b82f6" />
          <KPI title="Heridos" value={stats?.total_injured} color="#f59e0b" />
          <KPI title="Muertos" value={stats?.total_killed} color="#ef4444" />
          <KPI title="Avg Heridos/Crash" value={stats?.avg_injured_per_crash} color="#10b981" />
          <KPI title="Top Ciudad" value={stats?.top_city} color="#8b5cf6" />
        </div>

        <div className="grid grid-cols-3 gap-4" style={{height:360}}>
          <div className="col-span-2 rounded-xl overflow-hidden" style={{border:'1px solid #334155'}}><HeatmapMap qs={qs} /></div>
          <TopMakes qs={qs} />
        </div>

        <div className="grid grid-cols-3 gap-4" style={{height:280}}>
          <div className="col-span-2"><TrendChart qs={qs} /></div>
          <CollisionDonut qs={qs} />
        </div>

        <div className="grid grid-cols-2 gap-4" style={{height:280}}>
          <CityBars qs={qs} />
          <DayHourCharts qs={qs} />
        </div>

        <div className="grid grid-cols-2 gap-4" style={{height:300}}>
          <LuxuryBrands qs={qs} />
          <Demographics qs={qs} />
        </div>
      </div>

      <div className="flex-1 p-2" style={{display:view==='map'?'block':'none'}}>
        <div className="rounded-xl overflow-hidden h-full" style={{border:'1px solid #334155'}}><HeatmapMap qs={qs} /></div>
      </div>

      <div className="flex-1 overflow-y-auto p-4 space-y-4" style={{display:view==='brands'?'block':'none'}}>
        <div className="grid grid-cols-2 gap-4" style={{height:460}}>
          <LuxuryBrands qs={qs} />
          <TopMakes qs={qs} />
        </div>
        <div style={{height:300}}><Demographics qs={qs} /></div>
        <div style={{height:280}}><CollisionDonut qs={qs} /></div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
